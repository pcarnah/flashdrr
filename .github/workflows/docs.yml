name: Docs

on:
  push:
    branches: [main]
    # Tags may be ``v1.2.3`` or bare ``1.2.3`` — both forms build a stable
    # docs snapshot. ``refs/tags/*`` matches everything; we just don't want
    # to filter further here because tag naming isn't enforced.
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure main branch ref is available
        run: |
            git branch -f main origin/main || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-docs-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-docs-${{ runner.os }}-

      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          # Heavy runtime deps (torch, torchvision, monai, triton) are mocked
          # in docs/conf.py via autodoc_mock_imports, so we install flashdrr
          # with --no-deps to skip them entirely. This keeps the docs job off
          # the CUDA wheels and ~1 GB lighter. The [docs] extra's own deps
          # (sphinx, myst-parser, sphinx-rtd-theme, sphinx-multiversion) have
          # to be installed explicitly since --no-deps also skips them.
          # sphinx is pinned to <9 because sphinx-multiversion 0.2.4 still
          # calls the old Config.read(path, overrides) two-arg form, which
          # Sphinx 9.0 removed (see sphinx-doc/sphinx#13633).
          python -m pip install 'sphinx<9' myst-parser sphinx-rtd-theme sphinx-multiversion
          python -m pip install --no-deps -e "."

      - name: Build versioned site
        run: |
          # ``sphinx-multiversion`` parses its own positional ``sourcedir``,
          # ``outputdir`` and ``filenames`` with argparse. Attaching the
          # builder name (``-bhtml``) keeps argparse from slurping the
          # value of ``-b`` into the positional ``filenames`` list, which
          # would then be passed through to sphinx as a stray filename.
          sphinx-multiversion docs docs/_build/html -bhtml -q

      - name: Stage landing page
        run: |
          # sphinx-multiversion produces one subdirectory per ref under
          # docs/_build/html/ with smv_outputdir_format = '{ref.name}' and
          # smv_remote_whitelist = None, so the dev build lands at
          # ``main/`` and released tags land at ``<version>/`` (e.g.
          # ``0.5.1/``). Drop a tiny landing page at the site root that
          # auto-redirects to the development build so the GitHub Pages
          # URL still resolves to *something* even before any version is
          # "active".
          cat > docs/_build/html/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>FlashDRR documentation</title>
          <meta http-equiv="refresh" content="0; url=main/">
          <link rel="canonical" href="main/">
          </head>
          <body>
          <p><a href="main/">main (development)</a></p>
          </body>
          </html>
          HTML

      - name: Verify build
        run: |
          # The dev build is always present (smv_branch_whitelist
          # matches ``main``). Released tags are only present once a
          # matching tag is pushed — make the latter a soft check that
          # emits a notice instead of failing the step.
          test -d docs/_build/html/main
          if [ ! -d docs/_build/html/0.5.1 ] && \
             ! ls docs/_build/html/ 2>/dev/null | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::no released tag build yet (no matching tag exists)"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
